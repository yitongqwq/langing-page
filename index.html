<!doctype html>
<html lang="en">
<head>
    <title>Example Domain</title>
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #eee;
            width: 60vw;
            margin: 15vh auto;
            font-family: system-ui, sans-serif;
        }
        h1 {
            font-size: 1.5em;
        }
        div {
            opacity: 0.8;
        }
        a:link,
        a:visited {
            color: #348;
        }
        
        .card {
            cursor: pointer;
            user-select: none;
        }
        
        .message-container {
            margin-top: 20px;
            min-height: 20px;
        }
        
        .error-message {
            padding: 15px;
            background-color: #ffebee;
            border-radius: 5px;
            border-left: 4px solid #f44336;
            text-align: center;
            opacity: 1;
        }
        
        .system-error {
            padding: 15px;
            background-color: #fff3e0;
            border-radius: 5px;
            border-left: 4px solid #ff9800;
            text-align: center;
            opacity: 1;
        }
        
        .loading {
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 5px;
            border-left: 4px solid #2196f3;
            text-align: center;
            color: #275c57;
            font-weight: bold;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="card" id="clickCard">
        <div>
            <h1>Example Domain</h1>
            <p>This domain is for use in documentation examples without needing permission. Avoid use in operations.</p>
            <p><a href="https://iana.org/domains/example" target="_blank" rel="noopener noreferrer">Learn more</a></p>
        </div>
        <div id="messageContainer" class="message-container"></div>
    </div>

    <script>
        let clickCount = 0;
        let clickTimer = null;
        let messageTimer = null;
        
        function ping(url) {
            return new Promise((resolve) => {
                const t = performance.now();
                fetch(url, {
                    method: "HEAD",
                    cache: "no-store",
                    mode: "no-cors"
                })
                .then(() => {
                    const delay = Math.round(performance.now() - t);
                    resolve(delay);
                })
                .catch(() => {
                    const delay = Math.round(performance.now() - t);
                    resolve(delay > 10000 ? null : delay);
                });

                setTimeout(() => resolve(null), 10000);
            });
        }
        
        function showMessage(html, isError = false) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = html;
            
            if (isError) {
                if (messageTimer) {
                    clearTimeout(messageTimer);
                }
                messageTimer = setTimeout(() => {
                    container.innerHTML = '';
                    messageTimer = null;
                }, 1500);
            }
        }
        
        document.getElementById('clickCard').addEventListener('click', async function(e) {
            if (e.target.tagName === 'A') {
                return;
            }
            
            clickCount++;
            
            if (clickTimer) {
                clearTimeout(clickTimer);
            }
            
            if (clickCount >= 10) {
                clickCount = 0;
                if (clickTimer) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                }
                
                showMessage('<div class="loading"><p>请稍候...</p></div>');
                
                try {
                    const data = await fetch('./data.json').then(r => r.json());
                    
                    if (!data.url || !Array.isArray(data.url)) {
                        showMessage('<div class="system-error"><p>系统出错，请稍后再试</p></div>', true);
                        return;
                    }
                    
                    const promises = data.url.map(async (url) => ({
                        url: url,
                        delay: await ping(url)
                    }));
                    
                    const results = await Promise.all(promises);
                    const available = results.filter(r => r.delay !== null);
                    
                    if (available.length === 0) {
                        showMessage('<div class="error-message"><p>您的网络状况不佳，请切换网络环境或稍后再试，您也可以联系站长反馈此事。</p></div>', true);
                        return;
                    }
                    
                    available.sort((a, b) => a.delay - b.delay);
                    window.location.href = available[0].url;
                    
                } catch {
                    showMessage('<div class="system-error"><p>系统出错，请稍后再试</p></div>', true);
                }
            } else {
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                    clickTimer = null;
                }, 1500);
            }
        });
    </script>
</body>
</html>
